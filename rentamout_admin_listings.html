<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rentamout Admin | Listings</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 14px;background:#f7f8f5;color:#202820;font:16px Arial,sans-serif}main{max-width:900px;margin:auto}.panel,.listing{background:white;border:1px solid #e2e6df;border-radius:14px;padding:18px;margin:0 0 14px}h1{margin:8px 0;font-size:22px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:12px}.page-heading h1{margin:0}.page-heading .link{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}@media(max-width:550px){.page-heading{flex-direction:column;align-items:flex-start;gap:14px}.page-heading h1{line-height:1.25}}h2{font-size:19px}.muted{color:#68736b;line-height:1.5}.photos{display:flex;gap:8px;overflow:auto}.photos img{width:130px;height:105px;object-fit:cover;border-radius:8px;cursor:zoom-in}
.photo-viewer{position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:58px 54px}
.photo-viewer.is-open{display:flex}
.photo-viewer img{display:block;max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.photo-viewer button{position:absolute;display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:rgba(25,35,30,.7);color:#fff;font-size:26px;line-height:1}
.photo-viewer-close{top:14px;right:14px}
.photo-viewer-prev{left:12px;top:50%;transform:translateY(-50%)}
.photo-viewer-next{right:12px;top:50%;transform:translateY(-50%)}
.photo-viewer-count{position:absolute;top:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;font-weight:700}
.photo-viewer button:focus-visible,.photos img:focus-visible{outline:3px solid #d7f36b;outline-offset:3px}
@media(max-width:550px){.photo-viewer{padding:64px 48px}.photo-viewer button{width:40px;height:40px}.photo-viewer-prev{left:5px}.photo-viewer-next{right:5px}}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.grid div{padding:9px;background:#f7f8f5;border-radius:8px;overflow-wrap:anywhere}textarea{width:100%;min-height:75px;padding:10px;border:1px solid #cbd3cb;border-radius:8px;font:inherit}.actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}button,a{padding:12px 15px;border:0;border-radius:8px;font-weight:700;text-decoration:none;cursor:pointer}.approve{background:#176b45;color:white}.reject{background:#fff0ed;color:#a12a20}.link{background:#eaf3ed;color:#176b45}button:disabled{opacity:.5}[hidden]{display:none!important}.error{color:#a12a20}.success{color:#176b45}@media(max-width:550px){.actions button{width:100%}}

/* Shared Rentamout page header */
body{padding-top:70px!important}
.rentamout-profile-link{position:fixed;top:10px;left:10px;z-index:10002;width:46px;height:46px;border:2px solid #fff;border-radius:50%;background:#183b38;color:#fff;box-shadow:0 5px 18px rgba(20,45,35,.18);display:grid;place-items:center;overflow:hidden;text-decoration:none;font-size:18px;font-weight:850}
.rentamout-profile-link img{position:absolute;inset:0;display:block;width:100%;height:100%;max-width:none;object-fit:cover;object-position:center;border-radius:50%;background:transparent}
.rentamout-profile-link img[hidden]{display:none!important}
.rentamout-profile-link span{position:relative;z-index:1}
.rentamout-menu-button{position:fixed;top:10px;right:10px;z-index:10001;width:46px;height:46px;border:1px solid #dfe6dd;border-radius:14px;background:#fff;color:#183b38;box-shadow:0 5px 18px rgba(20,45,35,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.rentamout-menu-button span{display:block;width:21px;height:2px;border-radius:2px;background:currentColor;transition:transform .18s ease,opacity .18s ease}
.rentamout-menu-button[aria-expanded="true"] span:first-child{transform:translateY(7px) rotate(45deg)}
.rentamout-menu-button[aria-expanded="true"] span:nth-child(2){opacity:0}
.rentamout-menu-button[aria-expanded="true"] span:last-child{transform:translateY(-7px) rotate(-45deg)}
.rentamout-menu-panel{position:fixed;top:64px;right:10px;z-index:10000;width:min(290px,calc(100vw - 28px));padding:10px;background:#fff;border:1px solid #e2e8df;border-radius:16px;box-shadow:0 16px 44px rgba(20,45,35,.18);display:none}
.rentamout-menu-panel.is-open{display:block}
.rentamout-menu-panel a,.rentamout-menu-panel button{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#fff;text-align:left;text-decoration:none;color:#183b38;font-size:15px;font-weight:650;cursor:pointer}
.rentamout-menu-panel a:hover,.rentamout-menu-panel button:hover{background:#edf5dc}
.rentamout-menu-panel [hidden]{display:none!important}
@media(min-width:601px){.rentamout-profile-link{top:14px;left:14px}.rentamout-menu-button{top:14px;right:14px}.rentamout-menu-panel{top:70px;right:14px}}
</style></head><body>
<a class="rentamout-profile-link" id="rentamoutGlobalProfileLink" href="rentamout_profile.html" aria-label="Open my profile"><img id="rentamoutGlobalAvatarImage" alt="" hidden><span id="rentamoutGlobalAvatarInitial">R</span></a>
<main>
<section class="panel"><div class="page-heading"><h1>Vehicle listing review</h1></div><p class="muted">Review submitted vehicles and photos before publishing them.</p><p id="status" class="muted">Checking administrator access…</p></section>
<section id="queue" hidden><div class="panel"><h2>Pending listings</h2><p id="count" class="muted"></p></div><div id="items"></div></section>
</main>
<div class="photo-viewer" id="adminPhotoViewer" role="dialog" aria-modal="true" aria-label="Vehicle photo viewer">
 <button class="photo-viewer-close" id="adminPhotoClose" type="button" aria-label="Close photo viewer">×</button>
 <button class="photo-viewer-prev" id="adminPhotoPrev" type="button" aria-label="Previous photo">‹</button>
 <span class="photo-viewer-count" id="adminPhotoCount"></span>
 <img id="adminPhotoImage" alt="Expanded vehicle photo">
 <button class="photo-viewer-next" id="adminPhotoNext" type="button" aria-label="Next photo">›</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const db=window.supabase.createClient("https://ruadejhchqixmmvczgnj.supabase.co","sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340");
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG");
async function updateRentamoutAvatar(user){
 const {data:profile}=await db.from("profiles").select("full_name,avatar_url").eq("id",user.id).maybeSingle();
 const name=profile?.full_name||user?.user_metadata?.full_name||user?.email?.split("@")[0]||"R";
 const initial=$("rentamoutGlobalAvatarInitial"),img=$("rentamoutGlobalAvatarImage");
 initial.textContent=name.trim().charAt(0).toUpperCase()||"R";initial.hidden=false;
 const photo=profile?.avatar_url||user?.user_metadata?.avatar_url||user?.user_metadata?.picture||"";
 if(photo){img.src=photo;img.hidden=false;initial.hidden=true;}else{img.removeAttribute("src");img.hidden=true;}
}

// Full-screen photo viewer for administrator listing review.
const photoViewerState={images:[],index:0,touchX:0};
const photoViewer=$("adminPhotoViewer"),photoViewerImage=$("adminPhotoImage"),photoViewerCount=$("adminPhotoCount");
function renderAdminPhoto(){
 const total=photoViewerState.images.length;
 if(!total)return;
 photoViewerState.index=(photoViewerState.index+total)%total;
 photoViewerImage.src=photoViewerState.images[photoViewerState.index].src;
 photoViewerImage.alt=photoViewerState.images[photoViewerState.index].alt||"Expanded vehicle photo";
 photoViewerCount.textContent=(photoViewerState.index+1)+" / "+total;
 $("adminPhotoPrev").hidden=total<2;$("adminPhotoNext").hidden=total<2;
}
function openAdminPhoto(image){
 const card=image.closest(".listing");
 photoViewerState.images=Array.from(card.querySelectorAll(".photos img"));
 photoViewerState.index=photoViewerState.images.indexOf(image);
 renderAdminPhoto();photoViewer.classList.add("is-open");document.body.style.overflow="hidden";
 $("adminPhotoClose").focus();
}
function closeAdminPhoto(){
 photoViewer.classList.remove("is-open");document.body.style.overflow="";
 photoViewerImage.removeAttribute("src");
}
$("adminPhotoClose").addEventListener("click",closeAdminPhoto);
$("adminPhotoPrev").addEventListener("click",()=>{photoViewerState.index--;renderAdminPhoto();});
$("adminPhotoNext").addEventListener("click",()=>{photoViewerState.index++;renderAdminPhoto();});
photoViewer.addEventListener("click",event=>{if(event.target===photoViewer)closeAdminPhoto();});
photoViewer.addEventListener("touchstart",event=>{photoViewerState.touchX=event.changedTouches[0].clientX;},{passive:true});
photoViewer.addEventListener("touchend",event=>{
 const delta=event.changedTouches[0].clientX-photoViewerState.touchX;
 if(Math.abs(delta)>45&&photoViewerState.images.length>1){photoViewerState.index+=delta<0?1:-1;renderAdminPhoto();}
},{passive:true});
document.addEventListener("keydown",event=>{
 if(!photoViewer.classList.contains("is-open"))return;
 if(event.key==="Escape")closeAdminPhoto();
 else if(event.key==="ArrowLeft"){photoViewerState.index--;renderAdminPhoto();}
 else if(event.key==="ArrowRight"){photoViewerState.index++;renderAdminPhoto();}
});

async function load(){
 const {data:vs,error}=await db.from("vehicles").select("id,owner_id,make,model,year,location,transmission,seats,daily_price,security_deposit,description,registration_number,created_at").eq("status","pending").order("created_at");
 if(error)throw error;
 const rows=vs||[]; $("queue").hidden=false; $("count").textContent=rows.length+" pending listing(s).";
 if(!rows.length){$("items").textContent="No listings are awaiting review.";return;}
 const {data:ps,error:pe}=await db.from("vehicle_photos").select("vehicle_id,photo_url,sort_order").in("vehicle_id",rows.map(v=>v.id)).order("sort_order");
 if(pe)console.warn(pe);
 const map=new Map();(ps||[]).forEach(p=>{if(!map.has(p.vehicle_id))map.set(p.vehicle_id,[]);map.get(p.vehicle_id).push(p.photo_url);});
 $("items").innerHTML=rows.map(v=>'<article class="listing" data-id="'+esc(v.id)+'"><h2>'+esc([v.year,v.make,v.model].filter(Boolean).join(" "))+'</h2><div class="photos">'+(map.get(v.id)||[]).map((u,i)=>'<img src="'+esc(u)+'" alt="Vehicle photo '+(i+1)+'">').join("")+'</div><div class="grid"><div><b>Location</b><br>'+esc(v.location)+'</div><div><b>Daily price</b><br>'+money(v.daily_price)+'</div><div><b>Deposit</b><br>'+money(v.security_deposit)+'</div><div><b>Transmission / seats</b><br>'+esc(v.transmission||"—")+' / '+esc(v.seats??"—")+'</div><div><b>Registration</b><br>'+esc(v.registration_number||"Not provided")+'</div><div><b>Owner ID</b><br>'+esc(v.owner_id)+'</div></div><p>'+esc(v.description||"No description")+'</p><label>Rejection reason (required to reject)</label><textarea placeholder="Explain what needs to be corrected"></textarea><div class="actions"><button class="approve" data-decision="approve">Approve listing</button><button class="reject" data-decision="reject">Reject listing</button></div><p class="result muted"></p></article>').join("");
 $("items").querySelectorAll(".photos img").forEach((img,index)=>{
  img.alt="Vehicle photo "+(index+1);img.tabIndex=0;img.setAttribute("role","button");img.title="Tap to view full-screen";
  img.setAttribute("aria-label",img.alt+". Open full-screen photo viewer.");
  img.addEventListener("click",()=>openAdminPhoto(img));
  img.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();openAdminPhoto(img);}});
 });
 $("items").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>review(b)));
}
async function review(b){
 const card=b.closest(".listing"),decision=b.dataset.decision,reason=card.querySelector("textarea").value.trim(),msg=card.querySelector(".result");
 if(decision==="reject"&&!reason){msg.textContent="Enter a rejection reason first.";msg.className="result error";return;}
 if(!window.confirm(decision==="approve"?"Approve and publish this listing?":"Reject this listing?"))return;
 card.querySelectorAll("button").forEach(x=>x.disabled=true);
 try{
  const {error}=await db.rpc("admin_review_vehicle_listing",{p_vehicle_id:card.dataset.id,p_decision:decision,p_rejection_reason:decision==="reject"?reason:null});
  if(error)throw error;
  card.remove();$("count").textContent=$("items").querySelectorAll(".listing").length+" pending listing(s).";
  if(!$("items").querySelector(".listing"))$("items").textContent="All pending listings have been reviewed.";
 }catch(e){msg.textContent=e.message||"Review failed.";msg.className="result error";card.querySelectorAll("button").forEach(x=>x.disabled=false);}
}
async function init(){
 try{
  const {data,error}=await db.auth.getSession();if(error)throw error;
  if(!data.session){location.href="rentamout_guest_auth.html?next="+encodeURIComponent("rentamout_admin_listings.html");return;}
  await updateRentamoutAvatar(data.session.user);
  const {data:p,error:pe}=await db.from("profiles").select("role").eq("id",data.session.user.id).maybeSingle();if(pe)throw pe;
  if(p?.role!=="admin"){$("status").textContent="Access denied. Administrator account required.";$("status").className="error";return;}
  await load();$("status").textContent="Administrator access verified.";
 }catch(e){$("status").textContent=e.message||"Unable to load review queue.";$("status").className="error";}
}
db.auth.onAuthStateChange(e=>{if(e==="SIGNED_OUT")location.href="rentamout_guest_auth.html";});
init();
</script>
<button class="rentamout-menu-button" id="rentamoutMenuButton" type="button" aria-label="Open navigation menu" aria-controls="rentamoutMenuPanel" aria-expanded="false"><span></span><span></span><span></span></button>
<nav class="rentamout-menu-panel" id="rentamoutMenuPanel" aria-label="Account menu">
 <div id="rentamoutHeaderMenuUser" style="padding:12px 13px 14px;border-bottom:1px solid #edf0e9;margin-bottom:5px;color:#68766f;font-size:13px;font-weight:700;overflow-wrap:anywhere">Welcome to Rentamout</div>
 <a href="index.html">Home</a><a href="rentamout_car_listing.html">Browse Cars</a><a href="rentamout_list_your_car.html">List Your Car</a><a href="rentamout_my_vehicle_listings.html">My Vehicles</a><a href="rentamout_owner_bookings.html">My Bookings</a><a href="rentamout_chat.html">Messages</a><a href="rentamout_profile.html">My Profile</a>
 <button type="button" id="rentamoutHeaderSignOut" hidden style="color:#a33333">Sign out</button><p id="rentamoutHeaderMenuStatus" style="font-size:12px;color:#a12a20;margin:4px 12px"></p>
</nav>
<script>
(function(){const b=document.getElementById("rentamoutMenuButton"),p=document.getElementById("rentamoutMenuPanel");if(!b||!p)return;function close(){p.classList.remove("is-open");b.setAttribute("aria-expanded","false");}b.addEventListener("click",()=>{const open=!p.classList.contains("is-open");p.classList.toggle("is-open",open);b.setAttribute("aria-expanded",String(open));});document.addEventListener("click",e=>{if(!b.contains(e.target)&&!p.contains(e.target))close();});document.addEventListener("keydown",e=>{if(e.key==="Escape")close();});})();
(function(){const signOut=document.getElementById("rentamoutHeaderSignOut"),menuUser=document.getElementById("rentamoutHeaderMenuUser"),status=document.getElementById("rentamoutHeaderMenuStatus");const client=window.supabase.createClient("https://ruadejhchqixmmvczgnj.supabase.co","sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340");client.auth.getSession().then(({data})=>{const user=data.session?.user;if(user){menuUser.textContent=user.user_metadata?.full_name||user.email||"Your account";signOut.hidden=false;}});signOut.addEventListener("click",async()=>{signOut.disabled=true;try{const {error}=await client.auth.signOut();if(error)throw error;location.href="rentamout_guest_auth.html";}catch(e){status.textContent=e.message||"Could not sign out.";signOut.disabled=false;}});})();
</script>
</body></html>
