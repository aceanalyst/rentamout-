<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Bookings | rentamout</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#202820;background:#f7f8f5}header{padding:18px 5%;background:#183b38;border-bottom:3px solid #176b5b}.logo{font-size:25px;font-weight:800;color:#fff;text-decoration:none}main{max-width:900px;margin:25px auto;padding:0 16px 40px}.panel,.booking{background:#fff;border:1px solid #e2e6df;border-radius:15px;padding:20px;margin-bottom:16px}h1{font-size:27px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#68736b;line-height:1.6}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf1eb;font-size:12px;font-weight:700}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.nav a{display:inline-block;padding:12px 16px;border-radius:9px;background:#eaf3ed;color:#176b45;text-decoration:none;font-weight:700}.price{font-weight:800;color:#176b45}.booking p{margin:8px 0;line-height:1.5}[hidden]{display:none!important}@media(max-width:550px){.nav a{flex:1;text-align:center}}
</style>
</head>
<body>
<header><a class="logo" href="index.html">rentamout</a></header>
<main>
<div class="nav"><a href="rentamout_my_vehicle_listings.html">← My Vehicles</a><a href="rentamout_car_listing.html">Browse Cars</a></div>
<section class="panel"><h1>Owner Bookings</h1><p class="muted">Bookings made for your vehicles, with rental dates and payment status.</p><div id="status" class="muted" role="status">Checking sign-in…</div></section>
<section id="results" class="panel" hidden><div id="message" class="muted" role="status">Loading bookings…</div><div id="bookings"></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const db=window.supabase.createClient("https://ruadejhchqixmmvczgnj.supabase.co","sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340");
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
async function init(){
 try{
  const {data,error}=await db.auth.getSession();if(error)throw error;
  if(!data.session){location.href="rentamout_guest_auth.html?next="+encodeURIComponent("rentamout_owner_bookings.html");return;}
  $("status").textContent="Signed in. Loading your bookings…";$("results").hidden=false;
  const {data:rows,error:bookingError}=await db.rpc("get_my_owner_bookings");
  if(bookingError)throw bookingError;
  if(!rows||!rows.length){$("message").textContent="No bookings have been made for your vehicles yet.";return;}
  $("message").textContent=rows.length+" booking(s) found.";
  $("bookings").innerHTML=rows.map(b=>'<article class="booking"><h2>'+esc(b.vehicle_title||"Vehicle")+'</h2><p class="muted">'+esc(b.vehicle_location||"Location not provided")+'</p><p><strong>Booking reference:</strong> '+esc(b.booking_reference||"Not available")+'</p><p><strong>Pickup:</strong> '+esc(b.pickup_date)+' &nbsp; <strong>Return:</strong> '+esc(b.return_date)+'</p><p class="price">Rental total: '+money(b.total_amount)+'</p><p>Security deposit: '+money(b.security_deposit_amount)+'</p><p><strong>Booking:</strong> <span class="status">'+esc(b.status)+'</span></p><p><strong>Payment:</strong> <span class="status">'+esc(b.payment_status)+'</span></p></article>').join("");
  $("status").textContent="Your owner booking dashboard is ready.";
 }catch(e){console.error(e);$("status").textContent="Could not load owner bookings. Please refresh and try again.";$("results").hidden=false;$("message").textContent=e.message||"An unexpected error occurred.";}
}
db.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")location.href="rentamout_guest_auth.html?next="+encodeURIComponent("rentamout_owner_bookings.html");});
init();
</script>
</body>
</html>
