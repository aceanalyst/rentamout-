ng:16px}.booking-grid{grid-template-columns:1fr}.booking-top{display:block}.booking-top .status{margin-top:7px}.nav a{flex:1;text-align:center}}

<section class="panel"><h1>My Bookings</h1><p class="muted">All bookings linked to your account, whether you booked a car or someone booked one of your vehicles.</p><div id="status" class="muted" role="status">Checking sign-in…</div></section>

<div id="stats" class="stats" hidden></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search vehicle or booking reference" aria-label="Search bookings"><select id="bookingFilter" aria-label="Filter by booking status"><option value="all">All booking statuses</option><option value="payment_pending">Awaiting payment</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><select id="paymentFilter" aria-label="Filter by payment status"><option value="all">All payment statuses</option><option value="pending">Payment pending</option><option value="paid">Paid</option><option value="failed">Failed</option><option value="refunded">Refunded</option></select></div>
<div class="booking-tabs" role="group" aria-label="Booking date categories"><button type="button" class="booking-tab active" data-period="all" aria-pressed="true">All <span id="count-all">0</span></button><button type="button" class="booking-tab" data-period="upcoming" aria-pressed="false">Upcoming <span id="count-upcoming">0</span></button><button type="button" class="booking-tab" data-period="progress" aria-pressed="false">In Progress <span id="count-progress">0</span></button><button type="button" class="booking-tab" data-period="past" aria-pressed="false">Past <span id="count-past">0</span></button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const db=window.supabase.createClient("https://ruadejhchqixmmvczgnj.supabase.co","sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340");
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const statusLabel=v=>({payment_pending:"Awaiting payment",confirmed:"Confirmed",completed:"Completed",cancelled:"Cancelled",pending:"Pending",paid:"Paid",failed:"Failed",refunded:"Refunded"}[String(v||"").toLowerCase()]||String(v||"Unknown").replaceAll("_"," "));
let allBookings=[];
let activePeriod="all";
function localDate(value){if(!value)return null;const parts=String(value).slice(0,10).split("-").map(Number);return parts.length===3&&parts.every(Number.isFinite)?new Date(parts[0],parts[1]-1,parts[2]):null;}
function todayLocal(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function bookingPeriod(b){
 const today=todayLocal(),pickup=localDate(b.pickup_date),ret=localDate(b.return_date),st=String(b.status||"").toLowerCase();
 if(st==="cancelled"||st==="payment_pending"||st==="completed")return st==="completed"?"past":"other";
 if(ret&&ret<today)return "past";
 if(pickup&&ret&&pickup<=today&&ret>=today&&st==="confirmed")return "progress";
 if(pickup&&pickup>today&&st==="confirmed")return "upcoming";
 return "other";
}
function renderBookings(){
 const q=$("search").value.trim().toLowerCase(),bs=$("bookingFilter").value,ps=$("paymentFilter").value;
 const categorized=allBookings.map(b=>({...b,_period:bookingPeriod(b)}));
 ["all","upcoming","progress","past"].forEach(period=>{const el=$("count-"+period);if(el)el.textContent=period==="all"?allBookings.length:categorized.filter(b=>b._period===period).length;});
 const rows=categorized.filter(b=>(activePeriod==="all"||(activePeriod==="upcoming"?b._period==="upcoming":activePeriod==="progress"?b._period==="progress":b._period==="past"))&&(bs==="all"||String(b.status||"").toLowerCase()===bs)&&(ps==="all"||String(b.payment_status||"").toLowerCase()===ps)&&(!q||[b.vehicle_title,b.vehicle_location,b.booking_reference].some(v=>String(v||"").toLowerCase().includes(q))));
 rows.sort((a,b)=>{const ad=localDate(activePeriod==="past"?a.return_date:a.pickup_date),bd=localDate(activePeriod==="past"?b.return_date:b.pickup_date);if(!ad&&!bd)return 0;if(!ad)return 1;if(!bd)return -1;return activePeriod==="past"?bd-ad:ad-bd;});
 const labels={upcoming:"Upcoming rental",progress:"Rental in progress",past:"Past rental",other:"Needs attention"};
 $("message").textContent=rows.length+" of "+allBookings.length+" booking(s) shown.";
 $("bookings").innerHTML=rows.length?rows.map(b=>{
  const st=String(b.status||"").toLowerCase(),pay=String(b.payment_status||"").toLowerCase();
  const periodLabel=labels[b._period]||"Booking";
  const isOwner=b.booking_role==="owner";
  return '<article class="booking" data-booking-id="'+esc(b.booking_id)+'"><div class="booking-top"><div><h2>'+esc(b.vehicle_title||"Vehicle")+'</h2><p class="muted">'+esc(b.vehicle_location||"Location not provided")+'</p><span class="booking-period">'+esc(periodLabel)+'</span><span class="booking-period">'+(isOwner?"You are the owner":"You are the renter")+'</span></div><span class="status '+esc(st)+'">'+esc(statusLabel(st))+'</span></div><div class="booking-grid"><p><strong>Reference:</strong> '+esc(b.booking_reference||"Not available")+'</p><p><strong>Other party:</strong> '+esc(b.counterparty_name||"Not provided")+'</p><p><strong>Other party phone:</strong> '+esc(b.counterparty_phone||"Not provided")+'</p><p><strong>Payment:</strong> <span class="status '+esc(pay)+'">'+esc(statusLabel(pay))+'</span></p><p><strong>Pickup:</strong> '+esc(b.pickup_date||"Not set")+'</p><p><strong>Return:</strong> '+esc(b.return_date||"Not set")+'</p><p class="price">Rental total: '+money(b.total_amount)+'</p><p>Security deposit: '+money(b.security_deposit_amount)+'</p><p>Checkout total: '+money(b.checkout_total)+'</p><p class="muted">Booked: '+esc(b.created_at?new Date(b.created_at).toLocaleDateString():"Not available")+'</p></div><div class="booking-actions"><a class="detail-button" href="rentamout_chat.html?booking='+encodeURIComponent(b.booking_id)+'" style="display:inline-block;text-decoration:none;margin-right:7px">Message '+(isOwner?"renter":"owner")+'</a>'+(isOwner?'<button type="button" class="detail-button" data-detail-id="'+esc(b.booking_id)+'" aria-expanded="false">View booking details</button>':'')+'<div class="booking-detail" id="detail-'+esc(b.booking_id)+'" hidden></div></div></article>';
 }).join(""):'<div class="empty">No bookings in this category match your filters.</div>';
}
async function loadBookings(){
 $("message").textContent="Loading bookings…";$("bookings").innerHTML="";
 const {data:rows,error}=await db.rpc("get_my_owner_bookings");
 if(error)throw error;
 allBookings=rows||[];
 const confirmed=allBookings.filter(b=>String(b.status||"").toLowerCase()==="confirmed").length;
 const paid=allBookings.filter(b=>String(b.payment_status||"").toLowerCase()==="paid").length;
 $("stats").innerHTML='<div class="stat"><strong>'+allBookings.length+'</strong><span>Total bookings</span></div><div class="stat"><strong>'+confirmed+'</strong><span>Confirmed</span></div><div class="stat"><strong>'+paid+'</strong><span>Paid</span></div>';
 $("stats").hidden=false;renderBookings();
}
function showLoadError(e){console.error(e);$("message").textContent="Could not load bookings. Please refresh and try again.";$("bookings").innerHTML="";}
$("search").addEventListener("input",renderBookings);
$("bookingFilter").addEventListener("change",renderBookings);
$("paymentFilter").addEventListener("change",renderBookings);
document.querySelectorAll(".booking-tab").forEach(button=>button.addEventListener("click",()=>{activePeriod=button.dataset.period;document.querySelectorAll(".booking-tab").forEach(tab=>{const selected=tab===button;tab.classList.toggle("active",selected);tab.setAttribute("aria-pressed",String(selected));});renderBookings();}));
$("bookings").addEventListener("click",async event=>{const button=event.target.closest("[data-detail-id]");if(!button)return;const id=button.dataset.detailId;const panel=$("detail-"+id);if(!panel)return;if(!panel.hidden){panel.hidden=true;button.setAttribute("aria-expanded","false");button.textContent="View booking details";return;}panel.hidden=false;button.setAttribute("aria-expanded","true");button.textContent="Hide booking details";if(panel.dataset.loaded==="true")return;panel.textContent="Loading booking details…";button.disabled=true;try{const {data,error}=await db.rpc("get_my_owner_booking_detail",{p_booking_id:id});if(error)throw error;if(!data){panel.textContent="Booking details could not be found.";return;}const d=data;panel.innerHTML='<h3>Renter and payment details</h3><div class="detail-grid"><p><strong>Renter:</strong> '+esc(d.renter_name)+'</p><p><strong>Phone:</strong> '+(d.renter_phone&&d.renter_phone!=="Phone not provided"?'<a href="tel:'+esc(d.renter_phone)+'">'+esc(d.renter_phone)+'</a>':esc(d.renter_phone))+'</p><p><strong>Daily rate:</strong> '+money(d.daily_price)+'</p><p><strong>Transaction fee:</strong> '+money(d.transaction_fee)+'</p><p><strong>Owner share:</strong> '+money(d.owner_share)+'</p><p><strong>Platform share:</strong> '+money(d.platform_share)+'</p><p><strong>Payment reference:</strong> '+esc(d.payment_reference||"Not available")+'</p><p><strong>Booking created:</strong> '+esc(d.created_at?new Date(d.created_at).toLocaleString():"Not available")+'</p></div>';panel.dataset.loaded="true";}catch(error){console.error(error);panel.textContent="Could not load details. Please close and try again.";}finally{button.disabled=false;}});
$("refresh").addEventListener("click",()=>loadBookings().catch(showLoadError));
async function init(){
 try{
  const {data,error}=await db.auth.getSession();if(error)throw error;
  if(!data.session){location.href="rentamout_guest_auth.html?next="+encodeURIComponent("rentamout_owner_bookings.html");return;}
  $("status").textContent="Signed in. Loading your bookings…";$("results").hidden=false;
  await loadBookings();
  $("status").textContent="";
 }catch(e){console.error(e);$("status").textContent="Could not load owner bookings. Please refresh and try again.";$("results").hidden=false;showLoadError(e);}
}
db.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")location.href="rentamout_guest_auth.html?next="+encodeURIComponent("rentamout_owner_bookings.html");});
init();
</script>

<script>
(function(){
  const button=document.getElementById("rentamoutMenuButton");
  const panel=document.getElementById("rentamoutMenuPanel");
  const initial=document.getElementById("rentamoutGlobalAvatarInitial");
  const image=document.getElementById("rentamoutGlobalAvatarImage");
  const signIn=document.getElementById("rentamoutHeaderSignIn");
  const signOut=document.getElementById("rentamoutHeaderSignOut");
  const menuStatus=document.getElementById("rentamoutHeaderMenuStatus");
  if(!button||!panel)return;
  function closeMenu(){panel.classList.remove("is-open");button.setAttribute("aria-expanded","false");}
  button.addEventListener("click",function(){const open=!panel.classList.contains("is-open");panel.classList.toggle("is-open",open);button.setAttribute("aria-expanded",String(open));});
  document.addEventListener("click",function(event){if(!button.contains(event.target)&&!panel.contains(event.target))closeMenu();});
  document.addEventListener("keydown",function(event){if(event.key==="Escape")closeMenu();});
  (async function(){
    try{
      const {data,error}=await db.auth.getSession();if(error)throw error;
      const user=data&&data.session&&data.session.user;
      if(user){
        const name=user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split("@")[0]||"Rentamout";
        if(initial)initial.textContent=name.trim().charAt(0).toUpperCase()||"R";
        const photo=user.user_metadata?.avatar_url||user.user_metadata?.picture||"";
        if(image&&photo){image.src=photo;image.hidden=false;if(initial)initial.hidden=true;}
        signOut.hidden=false;signIn.hidden=true;
      }else{
        if(initial)initial.textContent="R";
        signOut.hidden=true;signIn.hidden=false;
      }
    }catch(error){console.warn("Could not load account header:",error);}
  })();
  signOut.addEventListener("click",async function(){
    signOut.disabled=true;signOut.textContent="Signing out…";menuStatus.textContent="";
    try{const {error}=await db.auth.signOut();if(error)throw error;location.replace("rentamout_guest_auth.html");}
    catch(error){console.error(error);menuStatus.textContent=error.message||"Could not sign out. Please try again.";signOut.disabled=false;signOut.textContent="Sign out";}
  });
})();
