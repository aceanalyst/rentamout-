<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner Bookings | rentamout</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#202820;background:#f7f8f5}header{padding:18px 5%;background:#183b38;border-bottom:3px solid #176b5b}.logo{font-size:25px;font-weight:800;color:#fff;text-decoration:none}main{max-width:960px;margin:25px auto;padding:0 16px 40px}.panel,.booking{background:#fff;border:1px solid #e2e6df;border-radius:15px;padding:20px;margin-bottom:16px}h1{font-size:27px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#68736b;line-height:1.6}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf1eb;font-size:12px;font-weight:700}.status.confirmed,.status.paid,.status.completed{background:#e2f5e9;color:#176b45}.status.payment_pending,.status.pending{background:#fff3d7;color:#805b00}.status.cancelled,.status.failed,.status.refunded{background:#fce8e6;color:#a12b24}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.nav a,.refresh{display:inline-block;padding:12px 16px;border-radius:9px;background:#eaf3ed;color:#176b45;text-decoration:none;font-weight:700;border:0;cursor:pointer;font-size:14px}.toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:10px;margin:16px 0}.toolbar input,.toolbar select{width:100%;min-width:0;padding:12px;border:1px solid #d8dfd6;border-radius:9px;background:#fff;font-size:14px;color:#202820}
.booking-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:8px}.booking-tab{flex:1;min-width:max-content;padding:11px 13px;border:1px solid #dce4da;border-radius:10px;background:#fff;color:#355147;font-weight:700;font-size:13px;cursor:pointer}.booking-tab span{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;margin-left:5px;padding:0 5px;border-radius:20px;background:#edf1eb;font-size:11px}.booking-tab.active{background:#183b38;border-color:#183b38;color:#fff}.booking-tab.active span{background:#fff;color:#183b38}.booking-period{display:inline-block;margin-top:5px;padding:4px 8px;border-radius:7px;background:#f1f5ed;color:#45614f;font-size:12px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}.stat{padding:13px;border-radius:11px;background:#f3f6f1}.stat strong{display:block;font-size:22px;margin-bottom:4px}.stat span{font-size:12px;color:#68736b}.booking p{margin:8px 0;line-height:1.5}.booking-actions{margin-top:14px}.detail-button{padding:10px 13px;border:0;border-radius:9px;background:#183b38;color:#fff;font-weight:700;cursor:pointer}.booking-detail{margin-top:14px;padding:14px;border-radius:10px;background:#f7f8f5;border:1px solid #e2e6df}.booking-detail p{overflow-wrap:anywhere}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}@media(max-width:620px){.detail-grid{grid-template-columns:1fr}}.booking-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.booking-top h2{margin-bottom:4px}.booking-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;margin-top:12px}.booking-grid p{overflow-wrap:anywhere}.price{font-weight:800;color:#176b45}.empty{padding:20px 0;text-align:center;color:#68736b}[hidden]{display:none!important}@media(max-width:620px){.toolbar{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:19px}.panel,.booking{padding:16px}.booking-grid{grid-template-columns:1fr}.booking-top{display:block}.booking-top .status{margin-top:7px}.nav a{flex:1;text-align:center}}

/* Match the homepage header color and logo treatment */
header{background:#f7f7f0!important;border-bottom:0!important;box-shadow:none!important}header a,.logo{color:#183b38!important}

/* Global quick-access menu */
.rentamout-menu-button{position:fixed;top:14px;right:14px;z-index:10001;width:48px;height:48px;border:1px solid #dfe6dd;border-radius:14px;background:#fff;color:#183b38;box-shadow:0 5px 18px rgba(20,45,35,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.rentamout-menu-button span{display:block;width:21px;height:2px;border-radius:2px;background:currentColor;transition:transform .18s ease,opacity .18s ease}
.rentamout-menu-button[aria-expanded="true"] span:first-child{transform:translateY(7px) rotate(45deg)}
.rentamout-menu-button[aria-expanded="true"] span:nth-child(2){opacity:0}
.rentamout-menu-button[aria-expanded="true"] span:last-child{transform:translateY(-7px) rotate(-45deg)}
.rentamout-menu-panel{position:fixed;top:70px;right:14px;z-index:10000;width:min(280px,calc(100vw - 28px));padding:10px;background:#fff;border:1px solid #e2e8df;border-radius:16px;box-shadow:0 16px 44px rgba(20,45,35,.18);display:none}
.rentamout-menu-panel.is-open{display:block}
.rentamout-menu-panel a{display:block;padding:14px 13px;border-radius:10px;text-decoration:none;color:#183b38;font-size:15px;font-weight:650}
.rentamout-menu-panel a:hover,.rentamout-menu-panel a:focus-visible{background:#edf5dc;outline:none}
@media(max-width:600px){.rentamout-menu-button{top:10px;right:10px;width:46px;height:46px}.rentamout-menu-panel{top:64px;right:10px}}

</style>
</head>
<body>
<header><a class="logo" href="index.html">rentamout</a></header>
<main>
<div class="nav"><a href="rentamout_my_vehicle_listings.html">← My Vehicles</a><a href="rentamout_car_listing.html">Browse Cars</a></div>
<section class="panel"><h1>Owner Bookings</h1><p class="muted">Track bookings for your vehicles, search references, and filter booking and payment statuses.</p><div id="status" class="muted" role="status">Checking sign-in…</div></section>
<section id="results" class="panel" hidden>
<div id="stats" class="stats" hidden></div>
<div class="toolbar"><input id="search" type="search" placeholder="Search vehicle or booking reference" aria-label="Search bookings"><select id="bookingFilter" aria-label="Filter by booking status"><option value="all">All booking statuses</option><option value="payment_pending">Awaiting payment</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><select id="paymentFilter" aria-label="Filter by payment status"><option value="all">All payment statuses</option><option value="pending">Payment pending</option><option value="paid">Paid</option><option value="failed">Failed</option><option value="refunded">Refunded</option></select></div>
<div class="booking-tabs" role="group" aria-label="Booking date categories"><button type="button" class="booking-tab active" data-period="all" aria-pressed="true">All <span id="count-all">0</span></button><button type="button" class="booking-tab" data-period="upcoming" aria-pressed="false">Upcoming <span id="count-upcoming">0</span></button><button type="button" class="booking-tab" data-period="progress" aria-pressed="false">In Progress <span id="count-progress">0</span></button><button type="button" class="booking-tab" data-period="past" aria-pressed="false">Past <span id="count-past">0</span></button></div>
<div id="message" class="muted" role="status">Loading bookings…</div><div id="bookings"></div><button id="refresh" class="refresh" type="button">Refresh bookings</button>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const db=window.supabase.createClient("https://ruadejhchqixmmvczgnj.supabase.co","sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340");
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₦"+Number(v||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2});
const statusLabel=v=>({payment_pending:"Awaiting payment",confirmed:"Confirmed",completed:"Completed",cancelled:"Cancelled",pending:"Pending",paid:"Paid",failed:"Failed",refunded:"Refunded"}[String(v||"").toLowerCase()]||String(v||"Unknown").replaceAll("_"," "));
let allBookings=[];
let activePeriod="all";
function localDate(value){if(!value)return null;const parts=String(value).slice(0,10).split("-").map(Number);return parts.length===3&&parts.every(Number.isFinite)?new Date(parts[0],parts[1]-1,parts[2]):null;}
function todayLocal(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function bookingPeriod(b){
 const today=todayLocal(),pickup=localDate(b.pickup_date),ret=localDate(b.return_date),st=String(b.status||"").toLowerCase();
 if(st==="cancelled"||st==="payment_pending"||st==="completed")return st==="completed"?"past":"other";
 if(ret&&ret<today)return "past";
 if(pickup&&ret&&pickup<=today&&ret>=today&&st==="confirmed")return "progress";
 if(pickup&&pickup>today&&st==="confirmed")return "upcoming";
 return "other";
}
function renderBookings(){
 const q=$("search").value.trim().toLowerCase(),bs=$("bookingFilter").value,ps=$("paymentFilter").value;
 const categorized=allBookings.map(b=>({...b,_period:bookingPeriod(b)}));
 ["all","upcoming","progress","past"].forEach(period=>{const el=$("count-"+period);if(el)el.textContent=period==="all"?allBookings.length:categorized.filter(b=>b._period===period).length;});
 const rows=categorized.filter(b=>(activePeriod==="all"||(activePeriod==="upcoming"?b._period==="upcoming":activePeriod==="progress"?b._period==="progress":b._period==="past"))&&(bs==="all"||String(b.status||"").toLowerCase()===bs)&&(ps==="all"||String(b.payment_status||"").toLowerCase()===ps)&&(!q||[b.vehicle_title,b.vehicle_location,b.booking_reference].some(v=>String(v||"").toLowerCase().includes(q))));
 rows.sort((a,b)=>{const ad=localDate(activePeriod==="past"?a.return_date:a.pickup_date),bd=localDate(activePeriod==="past"?b.return_date:b.pickup_date);if(!ad&&!bd)return 0;if(!ad)return 1;if(!bd)return -1;return activePeriod==="past"?bd-ad:ad-bd;});
 const labels={upcoming:"Upcoming rental",progress:"Rental in progress",past:"Past rental",other:"Needs attention"};
 $("message").textContent=rows.length+" of "+allBookings.length+" booking(s) shown.";
 $("bookings").innerHTML=rows.length?rows.map(b=>{
  const st=String(b.status||"").toLowerCase(),pay=String(b.payment_status||"").toLowerCase();
  const periodLabel=labels[b._period]||"Booking";
  return '<article class="booking" data-booking-id="'+esc(b.booking_id)+'"><div class="booking-top"><div><h2>'+esc(b.vehicle_title||"Vehicle")+'</h2><p class="muted">'+esc(b.vehicle_location||"Location not provided")+'</p><span class="booking-period">'+esc(periodLabel)+'</span></div><span class="status '+esc(st)+'">'+esc(statusLabel(st))+'</span></div><div class="booking-grid"><p><strong>Reference:</strong> '+esc(b.booking_reference||"Not available")+'</p><p><strong>Payment:</strong> <span class="status '+esc(pay)+'">'+esc(statusLabel(pay))+'</span></p><p><strong>Pickup:</strong> '+esc(b.pickup_date||"Not set")+'</p><p><strong>Return:</strong> '+esc(b.return_date||"Not set")+'</p><p class="price">Rental total: '+money(b.total_amount)+'</p><p>Security deposit: '+money(b.security_deposit_amount)+'</p><p>Checkout total: '+money(b.checkout_total)+'</p><p class="muted">Booked: '+esc(b.created_at?new Date(b.created_at).toLocaleDateString():"Not available")+'</p></div><div class="booking-actions"><button type="button" class="detail-button" data-detail-id="'+esc(b.booking_id)+'" aria-expanded="false">View booking details</button><div class="booking-detail" id="detail-'+esc(b.booking_id)+'" hidden></div></div></article>';
 }).join(""):'<div class="empty">No bookings in this category match your filters.</div>';
}
async function loadBookings(){
 $("message").textContent="Loading bookings…";$("bookings").innerHTML="";
 const {data:rows,error}=await db.rpc("get_my_owner_bookings");
 if(error)throw error;
 allBookings=rows||[];
 const confirmed=allBookings.filter(b=>String(b.status||"").toLowerCase()==="confirmed").length;
 const paid=allBookings.filter(b=>String(b.payment_status||"").toLowerCase()==="paid").length;
 $("stats").innerHTML='<div class="stat"><strong>'+allBookings.length+'</strong><span>Total bookings</span></div><div class="stat"><strong>'+confirmed+'</strong><span>Confirmed</span></div><div class="stat"><strong>'+paid+'</strong><span>Paid</span></div>';
 $("stats").hidden=false;renderBookings();
}
function showLoadError(e){console.error(e);$("message").textContent="Could not load bookings. Please refresh and try again.";$("bookings").innerHTML="";}
$("search").addEventListener("input",renderBookings);
$("bookingFilter").addEventListener("change",renderBookings);
$("paymentFilter").addEventListener("change",renderBookings);
document.querySelectorAll(".booking-tab").forEach(button=>button.addEventListener("click",()=>{activePeriod=button.dataset.period;document.querySelectorAll(".booking-tab").forEach(tab=>{const selected=tab===button;tab.classList.toggle("active",selected);tab.setAttribute("aria-pressed",String(selected));});renderBookings();}));
$("bookings").addEventListener("click",async event=>{const button=event.target.closest("[data-detail-id]");if(!button)return;const id=button.dataset.detailId;const panel=$("detail-"+id);if(!panel)return;if(!panel.hidden){panel.hidden=true;button.setAttribute("aria-expanded","false");button.textContent="View booking details";return;}panel.hidden=false;button.setAttribute("aria-expanded","true");button.textContent="Hide booking details";if(panel.dataset.loaded==="true")return;panel.textContent="Loading booking details…";button.disabled=true;try{const {data,error}=await db.rpc("get_my_owner_booking_detail",{p_booking_id:id});if(error)throw error;if(!data){panel.textContent="Booking details could not be found.";return;}const d=data;panel.innerHTML='<h3>Renter and payment details</h3><div class="detail-grid"><p><strong>Renter:</strong> '+esc(d.renter_name)+'</p><p><strong>Phone:</strong> '+(d.renter_phone&&d.renter_phone!=="Phone not provided"?'<a href="tel:'+esc(d.renter_phone)+'">'+esc(d.renter_phone)+'</a>':esc(d.renter_phone))+'</p><p><strong>Daily rate:</strong> '+money(d.daily_price)+'</p><p><strong>Transaction fee:</strong> '+money(d.transaction_fee)+'</p><p><strong>Owner share:</strong> '+money(d.owner_share)+'</p><p><strong>Platform share:</strong> '+money(d.platform_share)+'</p><p><strong>Payment reference:</strong> '+esc(d.payment_reference||"Not available")+'</p><p><strong>Booking created:</strong> '+esc(d.created_at?new Date(d.created_at).toLocaleString():"Not available")+'</p></div>';panel.dataset.loaded="true";}catch(error){console.error(error);panel.textContent="Could not load details. Please close and try again.";}finally{button.disabled=false;}});
$("refresh").addEventListener("click",()=>loadBookings().catch(showLoadError));
async function init(){
 try{
  const {data,error}=await db.auth.getSession();if(error)throw error;
  if(!data.session){location.href="rentamout_guest_auth.html?next="+encodeURIComponent("rentamout_owner_bookings.html");return;}
  $("status").textContent="Signed in. Loading your bookings…";$("results").hidden=false;
  await loadBookings();
  $("status").textContent="";
 }catch(e){console.error(e);$("status").textContent="Could not load owner bookings. Please refresh and try again.";$("results").hidden=false;showLoadError(e);}
}
db.auth.onAuthStateChange(event=>{if(event==="SIGNED_OUT")location.href="rentamout_guest_auth.html?next="+encodeURIComponent("rentamout_owner_bookings.html");});
init();
</script>
<button class="rentamout-menu-button" id="rentamoutMenuButton" type="button" aria-label="Open navigation menu" aria-controls="rentamoutMenuPanel" aria-expanded="false">
  <span></span><span></span><span></span>
</button>
<nav class="rentamout-menu-panel" id="rentamoutMenuPanel" aria-label="Quick navigation">
  <a href="index.html">Home</a>
  <a href="rentamout_car_listing.html">Browse Cars</a>
  <a href="rentamout_list_your_car.html">List Your Car</a>
  <a href="rentamout_my_vehicle_listings.html">My Vehicles</a>
</nav>
<script>
(function(){
  const button=document.getElementById("rentamoutMenuButton");
  const panel=document.getElementById("rentamoutMenuPanel");
  if(!button||!panel)return;
  function closeMenu(){panel.classList.remove("is-open");button.setAttribute("aria-expanded","false");button.setAttribute("aria-label","Open navigation menu");}
  button.addEventListener("click",function(){
    const open=!panel.classList.contains("is-open");
    panel.classList.toggle("is-open",open);
    button.setAttribute("aria-expanded",String(open));
    button.setAttribute("aria-label",open?"Close navigation menu":"Open navigation menu");
  });
  document.addEventListener("click",function(event){if(!button.contains(event.target)&&!panel.contains(event.target))closeMenu();});
  document.addEventListener("keydown",function(event){if(event.key==="Escape")closeMenu();});
})();
</script>

</body>
</html>
