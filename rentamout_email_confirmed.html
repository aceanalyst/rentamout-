<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confirmed | rentamout</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f1;color:#183b38;min-height:100vh;display:flex;flex-direction:column}
header{padding:22px 6%;background:#f7f7f0}
.logo{font-size:26px;font-weight:850;color:#183b38;text-decoration:none;letter-spacing:-1px}
main{width:100%;max-width:500px;margin:60px auto;padding:0 18px;flex:1}
.card{background:white;border:1px solid #e4e9df;border-radius:18px;padding:30px 26px;text-align:center;box-shadow:0 8px 30px rgba(24,59,56,.04)}
.check{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:#edf5dc;color:#176b5b;display:grid;place-items:center;font-size:30px;font-weight:800}
h1{font-size:28px;letter-spacing:-1px;margin:0 0 12px}
p{color:#697a76;line-height:1.65;font-size:15px;margin:0 0 14px;overflow-wrap:anywhere}
.action{display:block;text-decoration:none;background:#183b38;color:white;border-radius:10px;padding:15px;font-size:16px;font-weight:750;margin-top:24px}
footer{text-align:center;color:#697a76;font-size:12px;padding:20px}
</style>
</head>
<body>
<header><a class="logo" href="index.html">rentamout</a></header>
<main>
  <section class="card">
    <div class="check" id="statusIcon" aria-hidden="true">✓</div>
    <h1 id="heading">Confirming your email…</h1>
    <p id="details">Please wait while we verify your email address.</p>
    <a class="action" id="signInLink" href="rentamout_guest_auth.html" hidden>Continue to sign in</a>
  </section>
</main>
<footer>© rentamout. Rent what you need. Earn from what you own.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ruadejhchqixmmvczgnj.supabase.co";
const SUPABASE_KEY="sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const heading=document.getElementById("heading");
const details=document.getElementById("details");
const signInLink=document.getElementById("signInLink");
const statusIcon=document.getElementById("statusIcon");

(async()=>{
 try{
  const hashParams=new URLSearchParams(location.hash.slice(1));
  const queryParams=new URLSearchParams(location.search);
  const errorText=hashParams.get("error_description")||queryParams.get("error_description")||queryParams.get("error");
  if(errorText)throw new Error(errorText.replace(/\+/g," "));
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(!data.session)throw new Error("We couldn't verify this confirmation link. It may have expired or already been used. Please request a new confirmation email.");
  const {error:signOutError}=await db.auth.signOut();
  if(signOutError)throw signOutError;
  heading.textContent="Email confirmed successfully!";
  details.textContent="Your email address has been verified. You can now sign in to your Rentamout account.";
  signInLink.hidden=false;
  history.replaceState({},document.title,location.pathname);
 }catch(error){
  statusIcon.textContent="!";
  heading.textContent="Email confirmation unsuccessful";
  details.textContent=error.message||"This confirmation link could not be verified. Please request a new confirmation email.";
  signInLink.hidden=false;
  history.replaceState({},document.title,location.pathname);
 }
})();
</script>
</body>
</html>
