<script>
const SUPABASE_URL="https://ruadejhchqixmmvczgnj.supabase.co";
const SUPABASE_KEY="sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const heading=document.getElementById("heading");
const details=document.getElementById("details");
const signInLink=document.getElementById("signInLink");
const statusIcon=document.getElementById("statusIcon");

(async()=>{
 try{
  const hashParams=new URLSearchParams(location.hash.slice(1));
  const queryParams=new URLSearchParams(location.search);
  const errorText=hashParams.get("error_description")||queryParams.get("error_description")||queryParams.get("error");
  if(errorText)throw new Error(errorText.replace(/\+/g," "));
  const {data,error}=await db.auth.getSession();
  if(error)throw error;
  if(!data.session)throw new Error("We couldn't verify this confirmation link. It may have expired or already been used. Please request a new confirmation email.");
  const {error:signOutError}=await db.auth.signOut();
  if(signOutError)throw signOutError;
  heading.textContent="Email confirmed successfully!";
  details.textContent="Your email address has been verified. You can now sign in to your Rentamout account.";
  signInLink.hidden=false;
  history.replaceState({},document.title,location.pathname);
 }catch(error){
  statusIcon.textContent="!";
  heading.textContent="Email confirmation unsuccessful";
  details.textContent=error.message||"This confirmation link could not be verified. Please request a new confirmation email.";
  signInLink.hidden=false;
  history.replaceState({},document.title,location.pathname);
 }
})();
</script>
