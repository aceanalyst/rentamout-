<style>
:root{--ink:#183b38;--green:#176b5b;--lime:#d7f36b;--bg:#f7f7f0;--muted:#697a76}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{text-decoration:none;color:inherit}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 6%;gap:15px}
.logo{font-size:26px;font-weight:850;letter-spacing:-1.3px}.logo span{color:var(--green)}
.btn{display:inline-block;border:0;border-radius:30px;padding:13px 18px;background:var(--ink);color:white;font-weight:750;cursor:pointer}
main{max-width:1150px;margin:auto;padding:24px 5% 60px}
h1{font-size:clamp(34px,5vw,52px);letter-spacing:-2px;margin:12px 0}
.muted{color:var(--muted);line-height:1.6}
.search{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;background:white;padding:15px;border-radius:18px;margin:25px 0}
input,select{width:100%;min-width:0;padding:13px;border:1px solid #dce3d8;border-radius:10px;background:white;color:var(--ink);font-size:14px}
#status{padding:10px 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{background:white;border:1px solid #e7ebe2;border-radius:18px;overflow:hidden}
.photo{height:190px;background:#e4eadf;display:grid;place-items:center;color:var(--muted);background-size:cover;background-position:center}
.content{padding:18px}
.tag{font-size:11px;background:#edf5dc;padding:6px 9px;border-radius:20px;font-weight:800;color:#32654d}
h2{font-size:21px;margin:14px 0 6px}
.details{font-size:13px;color:var(--muted);line-height:1.7}
.owner-rating{margin-top:10px;font-size:13px;color:var(--ink);line-height:1.6}.owner-rating strong{font-weight:800}.owner-rating .stars{color:#b7791f;font-weight:850}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #edf0e9;padding-top:15px;margin-top:15px}
.price{font-size:17px;font-weight:850}.price small{font-size:12px;color:var(--muted);font-weight:500}
.empty{background:white;padding:25px;border-radius:15px}
@media(max-width:760px){.search{grid-template-columns:1fr 1fr}.search input:first-child{grid-column:1/-1}.search button{grid-column:1/-1}.grid{grid-template-columns:1fr}.photo{height:220px}}

/* Global quick-access menu */
.rentamout-menu-button{position:fixed;top:14px;right:14px;z-index:10001;width:48px;height:48px;border:1px solid #dfe6dd;border-radius:14px;background:#fff;color:#183b38;box-shadow:0 5px 18px rgba(20,45,35,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.rentamout-menu-button span{display:block;width:21px;height:2px;border-radius:2px;background:currentColor;transition:transform .18s ease,opacity .18s ease}

.rentamout-menu-button[aria-expanded="true"] span:nth-child(2){opacity:0}
.rentamout-menu-button[aria-expanded="true"] span:last-child{transform:translateY(-7px) rotate(-45deg)}
.rentamout-menu-panel{position:fixed;top:70px;right:14px;z-index:10000;width:min(280px,calc(100vw - 28px));padding:10px;background:#fff;border:1px solid #e2e8df;border-radius:16px;box-shadow:0 16px 44px rgba(20,45,35,.18);display:none}
.rentamout-menu-panel.is-open{display:block}
.rentamout-menu-panel a{display:block;padding:14px 13px;border-radius:10px;text-decoration:none;color:#183b38;font-size:15px;font-weight:650}
.rentamout-menu-panel a:hover,.rentamout-menu-panel a:focus-visible{background:#edf5dc;outline:none}
@media(max-width:600px){.rentamout-menu-button{top:10px;right:10px;width:46px;height:46px}.rentamout-menu-panel{top:64px;right:10px}}

.site-header{justify-content:flex-start;padding-right:78px}

cus-visible{background:#edf5dc!important;outline:none}.rentamout-menu-button span{display:block;width:21px;height:2px;border-radius:2px;background:currentColor;transition:transform .18s ease,opacity .18s ease}.rentamout-menu-button[aria-expanded="true"] span:first-child{transform:translateY(7px) rotate(45deg)}.rentamout-menu-button[aria-expanded="true"] span:nth-child(2){opacity:0}.rentamout-menu-button[aria-expanded="true"] span:last-child{transform:translateY(-7px) rotate(-45deg)}

<main>
<h1>Find your next ride.</h1>
<p class="muted">Explore available vehicles and choose one that fits your journey.</p>

<div class="search">
<input id="q" placeholder="Search make, model or location">
<select id="city"><option value="">All locations</option><option>Enugu</option><option>Lagos</option><option>Abuja</option><option>Port Harcourt</option></select>
<select id="trans"><option value="">All transmissions</option><option>Automatic</option><option>Manual</option></select>

</div>
<div id="status">Loading available cars…</div>
<div id="cars" class="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ruadejhchqixmmvczgnj.supabase.co";
// Use your Supabase publishable key here. Never use a secret/service_role key in a webpage.
const SUPABASE_KEY = "sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let vehicles = [];
let publicVehicleDetails = new Map();

function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function render(){
 const q=document.getElementById("q").value.trim().toLowerCase();
 const city=document.getElementById("city").value.toLowerCase();
 const trans=document.getElementById("trans").value.toLowerCase();
 const list=vehicles.filter(v=>
  (`${v.make} ${v.model} ${v.location}`).toLowerCase().includes(q) &&
  (!city || (v.location||"").toLowerCase().includes(city)) &&
  (!trans || (v.transmission||"").toLowerCase()===trans)
 );
 const el=document.getElementById("cars");
 document.getElementById("status").textContent=list.length ? `${list.length} vehicle${list.length===1?"":"s"} found` : "No vehicles match your search.";
 el.innerHTML=list.map(v=>{
  const name=`${v.make||""} ${v.model||""}`.trim();
  const photo=(v.vehicle_photos||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))[0]?.photo_url;
  const img=photo ? `style="background-image:url('${esc(photo).replace(/'/g,"%27")}')"` : "";
  return `<article class="card">
   <div class="photo" ${img}>${photo?"": "Vehicle photo coming soon"}</div>
   <div class="content">
    <span class="tag">✓ Verified listing</span>
    <h2>${esc(name)}</h2>
    <div class="details">${esc(v.location)} · ${esc(v.transmission||"Transmission not specified")} · ${esc(v.seats||"—")} seats<br>Year: ${esc(v.year||"—")}</div>
    <div class="owner-rating">Owner: <strong>${esc(publicVehicleDetails.get(v.id)?.owner_name||"Car owner")}</strong><br><span class="stars">★ ${Number(publicVehicleDetails.get(v.id)?.average_rating||0).toFixed(1)}</span> · ${Number(publicVehicleDetails.get(v.id)?.review_count||0)} ${Number(publicVehicleDetails.get(v.id)?.review_count||0)===1?"review":"reviews"}</div>
    <div class="bottom"><div class="price">₦${Number(v.daily_price).toLocaleString("en-NG")}<small> / day</small></div>
    <a class="btn view" data-id="${esc(v.id)}" href="#">View this car</a></div>
   </div></article>`;
 }).join("");
 el.querySelectorAll(".view").forEach(a=>a.addEventListener("click",e=>{
  e.preventDefault();
  // Public, published vehicle details are viewable without signing in.
  // Authentication is checked later when the visitor tries to reserve.
  location.href="/rentamout_detailed_rental.html?vehicle="+encodeURIComponent(a.dataset.id);
 }));
}
async function loadCars(){
 const status=document.getElementById("status");
 try{
  const {data,error}=await db.from("vehicles")
   .select("id,owner_id,make,model,year,location,transmission,seats,daily_price,vehicle_photos(photo_url,sort_order)")
   .eq("status","published").eq("verified",true).order("created_at",{ascending:false});
  if(error) throw error;
  vehicles=data||[];
  publicVehicleDetails=new Map();
  if(vehicles.length){
   const {data:ownerDetails,error:ownerError}=await db.rpc("get_vehicle_public_details",{p_vehicle_ids:vehicles.map(v=>v.id)});
   if(ownerError) console.warn("Owner/rating details unavailable:",ownerError.message);
   (ownerDetails||[]).forEach(item=>publicVehicleDetails.set(item.vehicle_id,item));
  }
  render();
 }catch(err){
  console.error(err);
  status.textContent="We couldn't load vehicles. Please refresh and try again.";
 }
}
document.getElementById("searchBtn").addEventListener("click",render);
document.getElementById("q").addEventListener("input",render);
document.getElementById("city").addEventListener("change",render);
document.getElementById("trans").addEventListener("change",render);
loadCars();
</script>

<script>
(function(){
  const button=document.getElementById("rentamoutMenuButton");
  const panel=document.getElementById("rentamoutMenuPanel");
  if(!button||!panel)return;
  function closeMenu(){panel.classList.remove("is-open");button.setAttribute("aria-expanded","false");button.setAttribute("aria-label","Open navigation menu");}
  button.addEventListener("click",function(){
    const open=!panel.classList.contains("is-open");
    panel.classList.toggle("is-open",open);
    button.setAttribute("aria-expanded",String(open));
    button.setAttribute("aria-label",open?"Close navigation menu":"Open navigation menu");
  });
  document.addEventListener("click",function(event){if(!button.contains(event.target)&&!panel.contains(event.target))closeMenu();});
  document.addEventListener("keydown",function(event){if(event.key==="Escape")closeMenu();});
})();
</script>

<script>
(function(){
  const panel=document.getElementById("rentamoutMenuPanel");
  const signIn=document.getElementById("rentamoutHeaderSignIn");
  const signOut=document.getElementById("rentamoutHeaderSignOut");
  const menuUser=document.getElementById("rentamoutHeaderMenuUser");
  const status=document.getElementById("rentamoutHeaderMenuStatus");
  if(!panel||!signIn||!signOut||!window.supabase)return;
  const db=window.rentamoutHeaderClient||(window.rentamoutHeaderClient=window.supabase.createClient("https://ruadejhchqixmmvczgnj.supabase.co","sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340"));
  function applySession(user){
    const signedIn=!!user;
    signIn.hidden=signedIn;
    signOut.hidden=!signedIn;
    if(menuUser)menuUser.textContent=signedIn?(user.user_metadata?.full_name||user.user_metadata?.name||user.email||"Your account"):"Welcome to Rentamout";
  }
  signOut.addEventListener("click",async function(){
    signOut.disabled=true;
    if(status)status.textContent="";
    try{const {error}=await db.auth.signOut();if(error)throw error;location.href="rentamout_guest_auth.html";}
    catch(error){if(status)status.textContent=error.message||"Could not sign out. Please try again.";signOut.disabled=false;}
  });
  db.auth.getSession().then(({data,error})=>{if(error)throw error;applySession(data.session?.user||null);}).catch(error=>{console.error("Rentamout menu session check failed",error);});
  db.auth.onAuthStateChange((_event,session)=>applySession(session?.user||null));
})();
</script>
<script>
(function(){
 const button=document.querySelector(".rentamout-menu-button,.account-menu-button");
 const badge=document.getElementById("rentamoutGlobalUnreadBadge");
 if(!button||!badge||!window.supabase)return;
 const db=window.rentamoutHeaderClient||(window.rentamoutHeaderClient=window.supabase.createClient("https://ruadejhchqixmmvczgnj.supabase.co","sb_publishable_QVBfWbirs8m9mjK8kjtxjg_5lISH340"));
 let channel=null;
 async function refresh(){
  const {data:sessionData}=await db.auth.getSession();
  const user=sessionData.session?.user;
  if(!user){badge.hidden=true;return;}
  const {data,error}=await db.rpc("get_my_unread_message_count");
  if(error){console.warn("Rentamout unread count:",error);return;}
  const count=Number(data||0);
  badge.textContent=count>99?"99+":String(count);
  badge.hidden=count===0;
  button.setAttribute("aria-label",count?("Open menu, "+count+" unread messages"):"Open menu");
 }
 refresh().catch(console.warn);
 db.auth.onAuthStateChange(()=>refresh().catch(console.warn));
 channel=db.channel("rentamout-global-unread-"+Math.random().toString(36).slice(2))
  .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},()=>refresh().catch(console.warn))
  .subscribe();
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh().catch(console.warn);});
})();
</script>
