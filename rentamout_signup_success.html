<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check your email | rentamout</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f1;color:#183b38;min-height:100vh;display:flex;flex-direction:column}
header{padding:22px 6%;background:#f7f7f0}
.logo{font-size:26px;font-weight:850;color:#183b38;text-decoration:none;letter-spacing:-1px}
.logo span{color:#a4c94b}
main{width:100%;max-width:500px;margin:60px auto;padding:0 18px;flex:1}
.card{background:white;border:1px solid #e4e9df;border-radius:18px;padding:30px 26px;text-align:center;box-shadow:0 8px 30px rgba(24,59,56,.04)}
.check{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;background:#edf5dc;color:#176b5b;display:grid;place-items:center;font-size:30px;font-weight:800}
h1{font-size:28px;letter-spacing:-1px;margin:0 0 12px}
p{color:#697a76;line-height:1.65;font-size:15px;margin:0 0 14px}
.action{display:block;text-decoration:none;background:#183b38;color:white;border-radius:10px;padding:15px;font-size:16px;font-weight:750;margin-top:24px}
footer{text-align:center;color:#697a76;font-size:12px;padding:20px}
</style>
</head>
<body>
<header><a class="logo" href="index.html">rentamout</a></header>
<main>
  <section class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Account created</h1>
    <p>Check your email for a confirmation link. Open the link to confirm your email address, then return to Rentamout to sign in.</p>
    <a class="action" href="rentamout_guest_auth.html">Return to sign in</a>
  </section>
</main>
<footer>© rentamout. Rent what you need. Earn from what you own.</footer>
</body>
</html>
