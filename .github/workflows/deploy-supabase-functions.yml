
name: Deploy RentAmOut Payment Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy initialize-payment
        run: supabase functions deploy initialize-payment --project-ref "$SUPABASE_PROJECT_ID" --use-api

      - name: Deploy verify-payment
        run: supabase functions deploy verify-payment --project-ref "$SUPABASE_PROJECT_ID" --use-api
